<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse - Bill Visualizer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-blue-600 text-white shadow-md p-4 mb-8">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">🗳️ CivicPulse</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full font-medium">Simple Civic Data</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 pb-12">
        
        <!-- Left 1/3 Column: Bill Overview & Visual Chart -->
        <div class="md:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 id="bill-title" class="text-xl font-bold text-gray-800 mb-2">Loading Bill...</h2>
                <p id="bill-summary" class="text-sm text-gray-600 leading-relaxed">Please wait while the data aggregates...</p>
            </div>

            <!-- Chart Card -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-md font-semibold text-gray-700 mb-4 text-center">Voting Breakdown</h3>
                <div class="w-full max-w-[220px] mx-auto">
                    <canvas id="voteChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Right 2/3 Column: Interactive Roll Call Directory -->
        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-gray-800">Representative Roll Call</h3>
                <!-- Simple Interactive Filter Links -->
                <div class="flex space-x-2 text-xs">
                    <button onclick="filterVotes('All')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded font-medium cursor-pointer">All</button>
                    <button onclick="filterVotes('Yes')" class="px-3 py-1 bg-green-100 text-green-700 hover:bg-green-200 rounded font-medium cursor-pointer">Yes</button>
                    <button onclick="filterVotes('No')" class="px-3 py-1 bg-red-100 text-red-700 hover:bg-red-200 rounded font-medium cursor-pointer">No</button>
                </div>
            </div>

            <!-- List Grid Output -->
            <div id="votes-list" class="space-y-4">
                <!-- Injected dynamically via app.js -->
            </div>
        </div>

    </main>

    <!-- App JavaScript Integration -->
    <script src="app.js"></script>
</body>
</html>
